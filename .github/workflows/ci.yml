name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: build + tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Selecionar Xcode 16 (Swift 6 + Swift Testing)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          swift --version

      - name: Cache do SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}

      - name: Build (0 warnings)
        run: |
          swift build 2>&1 | tee build.log
          ! grep -q "warning:" build.log

      - name: Testes
        run: swift test

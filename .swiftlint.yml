# Configuração do SwiftLint para o Uptend.
# Instale com `brew install swiftlint` e rode `swiftlint` na raiz do projeto.

included:
  - Sources
  - Tests

excluded:
  - .build
  - build
  - Resources

# Regras opcionais que ajudam a manter a consistência conforme o projeto cresce.
opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - first_where
  - sorted_first_last
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

disabled_rules:
  - trailing_comma          # usamos vírgula final em literais multi-linha
  - todo

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true

function_body_length:
  warning: 80
  error: 140

cyclomatic_complexity:
  warning: 18

identifier_name:
  min_length: 1            # `i`, `r`, `d` em parsers/loops são aceitáveis
  max_length: 60

nesting:
  type_level: 2
